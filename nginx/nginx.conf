# ====================================================================
# Configuración Nginx Reverse Proxy para GeneaTrack
# Dominio: cumpleaños.informaticosvenezuela.com / cumpleanos.informaticosvenezuela.com
# ====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name cumpleaños.informaticosvenezuela.com xn--cumpleaos-r6a.informaticosvenezuela.com cumpleanos.informaticosvenezuela.com;

    # Redirección HTTPS recomendada (descomentar al instalar Certbot / SSL)
    # return 301 https://$host$request_uri;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache de assets estáticos y fotos familiares
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000/uploads/;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
